    <script>
    (function() {
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSetRequestHeader = XMLHttpRequest.prototype.setRequestHeader;
        const originalSend = XMLHttpRequest.prototype.send;

        const mimeMap = {
            'jpg': 'image/jpeg', 'jpeg': 'image/jpeg', 'png': 'image/png', 'gif': 'image/gif',
            'mp4': 'video/mp4', 'mp3': 'audio/mpeg', 'pdf': 'application/pdf', 'txt': 'text/plain',
            'zip': 'application/zip', 'rar': 'application/x-rar-compressed', 'json': 'application/json',
            'csv': 'text/csv', 'html': 'text/html'
        };

        // ==========================================
        // STS 凭证全局预热与自动续期池
        // ==========================================
        let globalStsCredentials = null;
        let isFetchingSts = false;
        let stsPromise = null;

        // 从浏览器本地存储中捞出 AList 的登录令牌
        function getAlistToken() {
            return window.localStorage.getItem('alist_token') || '';
        }

        async function ensureStsCredentials() {
            if (globalStsCredentials) return globalStsCredentials;
            if (isFetchingSts) return await stsPromise;

            const currentToken = getAlistToken();
            // 核心拦截：如果连本地 Token 都没有（游客），根本就不去向后端要 STS，直接掐断
            if (!currentToken) {
                throw new Error("Unauthorized guest: Token not found locally.");
            }

            isFetchingSts = true;
            stsPromise = fetch('/api/get_upload_sts?path=/', {
                method: 'GET',
                headers: {
                    // 核心修复：把捞出来的身份令牌戴在头上！
                    'Authorization': currentToken
                }
            })
                .then(res => res.json())
                .then(data => {
                    if (data.code !== 200) throw new Error(data.message);
                    globalStsCredentials = data.data.credentials;
                    console.log("[STS Pool] 管理员凭证预热就绪，可以直传！");
                    return globalStsCredentials;
                })
                .catch(err => {
                    console.error("[STS Pool] 凭证获取失败:", err);
                    globalStsCredentials = null;
                    throw err;
                })
                .finally(() => { isFetchingSts = false; });
            
            return await stsPromise;
        }

        // 页面加载瞬间启动后台取 STS
        ensureStsCredentials().catch(()=>{});
        
        // 每 15 分钟强行清空并续期一次
        setInterval(() => {
            globalStsCredentials = null;
            ensureStsCredentials().catch(()=>{});
        }, 900000);

        function generateCleanUUID() {
            return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/[x]/g, function() {
                return (Math.random() * 16 | 0).toString(16);
            });
        }

        XMLHttpRequest.prototype.open = function(method, url) {
            this._method = method.toUpperCase();
            this._url = url;
            this._customHeaders = {};
            originalOpen.apply(this, arguments);
        };

        XMLHttpRequest.prototype.setRequestHeader = function(header, value) {
            this._customHeaders[header.toLowerCase()] = value;
            if (this._url.includes('/api/fs/put') || this._url.includes('/api/fs/form')) return; 
            originalSetRequestHeader.apply(this, arguments);
        };

        XMLHttpRequest.prototype.send = async function(body) {
            if ((this._url.includes('/api/fs/put') || this._url.includes('/api/fs/form')) && this._method === 'PUT') {
                
                // 原生 ProgressEvent 事件分发机
                const dispatchProgress = (p) => {
                    if (this.upload) {
                        const loaded = Math.round(body.size * p);
                        // 必须 dispatch 标准的 ProgressEvent，Axios 才能监听到！
                        this.upload.dispatchEvent(new ProgressEvent('progress', {
                            lengthComputable: true,
                            loaded: loaded,
                            total: body.size
                        }));
                    }
                };

                try {
                    const headerPath = this._customHeaders['file-path'] || '/unknown_file';
                    const rawPath = decodeURIComponent(decodeURIComponent(headerPath));
                    
                    const lastSlashIndex = rawPath.lastIndexOf('/');
                    const fileDir = lastSlashIndex === -1 ? "/" : rawPath.substring(0, lastSlashIndex + 1);
                    let fullFileName = lastSlashIndex === -1 ? rawPath : rawPath.substring(lastSlashIndex + 1);
                    if (fullFileName.startsWith('/')) fullFileName = fullFileName.substring(1);

                    const lastDotIndex = fullFileName.lastIndexOf('.');
                    const nameWithoutExt = lastDotIndex !== -1 ? fullFileName.substring(0, lastDotIndex) : fullFileName;
                    const fileExt = lastDotIndex !== -1 ? fullFileName.substring(lastDotIndex) : '';

                    const newFileName = `android${generateCleanUUID()}_${nameWithoutExt}${fileExt}`;
                    const finalVirtualPath = fileDir + fullFileName; 
                    const ossObjectKey = newFileName; 

                    const extPure = fileExt.replace('.', '').toLowerCase();
                    const contentType = (body && body.type) ? body.type : (mimeMap[extPure] || 'application/octet-stream');

                    // 零延迟秒取 STS
                    const creds = await ensureStsCredentials();

                    const client = new OSS({
                        region: creds.region || 'oss-cn-hangzhou',
                        accessKeyId: creds.AccessKeyId,
                        accessKeySecret: creds.AccessKeySecret,
                        stsToken: creds.SecurityToken,
                        bucket: creds.bucket,
                        secure: true
                    });

                    // 触发 Axios 开始上传的初始事件
                    if (this.upload) this.upload.dispatchEvent(new ProgressEvent('loadstart'));

                    // 直传推流
                    await client.put(ossObjectKey, body, {
                        headers: { 'Content-Type': contentType },
                        progress: function (p) {
                            dispatchProgress(p); // 丝滑推进进度条
                        }
                    });

                    // 上报 KV
                    await fetch('/api/fs/register_file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            path: finalVirtualPath, 
                            name: fullFileName,     
                            size: body.size,
                            oss_key: ossObjectKey   
                        })
                    });

                    // 强制进度条100%并触发上传结束事件
                    dispatchProgress(1);
                    if (this.upload) this.upload.dispatchEvent(new ProgressEvent('loadend'));

                    // 回归 44 字节极简响应 + 状态机闭合
                    const jsonResultString = '{"code":200,"message":"success","data":null}';

                    Object.defineProperty(this, 'readyState', { get: () => 4, configurable: true });
                    Object.defineProperty(this, 'status', { get: () => 200, configurable: true });
                    Object.defineProperty(this, 'statusText', { get: () => 'OK', configurable: true });
                    Object.defineProperty(this, 'response', { get: () => jsonResultString, configurable: true });
                    Object.defineProperty(this, 'responseText', { get: () => jsonResultString, configurable: true });

                    // 触发底层 XHR 的全套收尾事件，让 Axios 感知到 HTTP 200 OK 彻底结束
                    this.dispatchEvent(new Event('readystatechange'));
                    this.dispatchEvent(new ProgressEvent('load'));
                    this.dispatchEvent(new ProgressEvent('loadend'));
                    
                    console.log(`\u2705 [OSS Hook] ${fullFileName} 零延迟直传成功!`);
                    return; 

                } catch (e) {
                    console.error("\u274c [OSS Hook] 发生异常:", e);
                    Object.defineProperty(this, 'readyState', { get: () => 4, configurable: true });
                    Object.defineProperty(this, 'status', { get: () => 500, configurable: true });
                    Object.defineProperty(this, 'responseText', { get: () => `{"code":500,"message":"${e.message}","data":null}`, configurable: true });
                    
                    this.dispatchEvent(new Event('readystatechange'));
                    this.dispatchEvent(new ProgressEvent('error'));
                    this.dispatchEvent(new ProgressEvent('loadend'));
                    return;
                }
            }
            originalSend.apply(this, arguments);
        };
    })();
    </script>

  <body>

    <!-- 修正部分区域的透明 -->

            --hope-colors-background: transparent;
        }

    <script type="module">
        // v6

        // 提供用来监听代码控制的 url 变化的事件
        (() => {
            const wrapHistoryMethod = (type) => {
                const orig = history[type];
                return function (...args) {
                    const rv = orig.apply(this, args);
                    const event = new CustomEvent(type, { detail: args });
                    window.dispatchEvent(event);
                    return rv;
                };
            };
            history.pushState = wrapHistoryMethod('pushState');
            history.replaceState = wrapHistoryMethod('replaceState');
        })();

        class Beautifier {
            /**
                * Beautifier 类用于美化页面背景色
                * 
                * 其提供了3个方法：
                * - observe: 开始监听页面变化并美化背景色
                * - disconnect: 停止监听页面变化
                * - undo: 恢复页面背景色到默认状态
                *
                * 可以通过window.beautifier访问实例对象
                * 
            */
            static ignoredSelectors = [
                '.hope-tooltip', // 提示小标签及其装饰
                '.hope-tooltip__arrow',
                '.hope-checkbox__control',// 复选框
                '.hope-modal__overlay', // 模态框遮罩 
                '.hope-drawer__overlay', // 抽屉遮罩
                '.hope-select__option', // 下拉选项
                '.monaco-editor *', // 代码编辑器
                'button:not(.hope-menu__trigger)', // 除目录外按钮
                'svg' // SVG 图标
            ];

            static getSelector(mainSelector) {
                return `${mainSelector} :not(${Beautifier.ignoredSelectors.join('):not(')})`;
            }

            static lightSelector = Beautifier.getSelector('.hope-ui-light');
            static darkSelector = Beautifier.getSelector('.hope-ui-dark');

            static lightBgColor = 'rgba(255, 255, 255, 0.8)';
            static darkBgColor = 'rgb(32, 36, 37)';

            static specificPrefix = 'rgba(132, 133, 141,';

            constructor() {
                this.observer = null;
            }

            /**
             * @param {'light'|'dark'} theme
             */
            #rewriteStyle(theme) {
                let selector = theme === 'light' ? Beautifier.lightSelector : Beautifier.darkSelector;
                let bgColor = theme === 'light' ? Beautifier.lightBgColor : Beautifier.darkBgColor;

                document.querySelectorAll(selector).forEach(element => {
                    const computedStyle = getComputedStyle(element);

                    if (computedStyle.backgroundColor !== 'rgba(0, 0, 0, 0)' &&
                        !computedStyle.backgroundColor.startsWith(Beautifier.specificPrefix)) {
                        element.style.backgroundColor = bgColor;

                        element.setAttribute('data-beautified', 'true');
                    }
                });
            }

            #beautify() {
                if (!location.pathname.startsWith('/@manage') && !location.pathname.startsWith('/@login')) {
                    this.#rewriteStyle('light');
                    this.#rewriteStyle('dark');
                }
            }

            observe() {
                this.observer = new MutationObserver(this.#beautify.bind(this));
                this.observer.observe(document.body, {
                    childList: true,
                    subtree: true
                });

                this.#beautify();
            }

            disconnect() {
                if (this.observer) {
                    this.observer.disconnect();
                }
            }

            undo() {
                this.disconnect();

                document.body.querySelectorAll('[data-beautified]').forEach(element => {
                    element.style.backgroundColor = '';

                    element.removeAttribute('data-beautified');
                });
            }
        }

        const beautifier = new Beautifier();
        window.beautifier = beautifier;

        beautifier.observe();

        // 一个愚蠢到有点无敌的修复机制，不过工作良好
        (() => {
            function fixLogin(pathname) {
                if (pathname.startsWith('/@login')) {
                    beautifier.undo();
                }
                else {
                    beautifier.disconnect();
                    beautifier.observe();
                }
            }

            ['popstate', 'pushState', 'replaceState'].forEach(eventType => {
                addEventListener(eventType, () => {
                    fixLogin(location.pathname);
                });
            });
        })();
    </script>
